name: CT - Dense Rebuild

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/core/registry.py"
      - "src/indexing/dense.py"
      - "src/indexing/model_loader.py"
      - ".github/workflows/ct-dense.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dense-rebuild:
    name: Restore chunks, rebuild dense indexes, evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RAG_LLM_PROVIDER: stub
      RAG_EMBEDDING_CACHE_DIR: models/sentence-transformers
      RAG_EMBEDDING_OFFLINE: "false"
      RAG_GIT_COMMIT: ${{ github.sha }}
      RAG_DOCKER_IMAGE_TAG: ghcr.io/rastogiujj12/rag-mlops:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models/sentence-transformers
          key: sentence-transformers-${{ hashFiles('src/core/registry.py') }}
          restore-keys: |
            sentence-transformers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest CT artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p restored-artifacts

          RUN_ID=$(gh run list \
            --workflow "CT - Full Rebuild" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No previous full CT artefact found."
            echo "Run CT - Full Rebuild first."
            exit 1
          fi

          echo "Downloading artefacts from workflow run: $RUN_ID"
          gh run download "$RUN_ID" \
            --name "ct-artifacts-$(gh run view "$RUN_ID" --json headSha --jq '.headSha')" \
            --dir restored-artifacts || gh run download "$RUN_ID" --dir restored-artifacts

          cp -R restored-artifacts/* . || true

      - name: Verify restored artefacts
        run: |
          echo "Checking restored CT artefacts..."

          test -f data/processed/chunks.pkl
          test -f data/processed/corpus.jsonl
          test -f outputs/indices/bm25.pkl
          test -d outputs/indices/dense

          echo "Dense index folders:"
          find outputs/indices/dense -maxdepth 2 -type f -print || true

          echo "Restored artefacts verified."

      - name: Rebuild dense indexes
        run: |
          python -m src.cli train --force

      - name: Evaluate dense models and hybrid retriever
        run: |
          python -m src.cli evaluate

      - name: Show selected model and evaluation report
        run: |
          cat outputs/best_model.json
          cat outputs/eval/evaluation_report.md

      - name: Upload CT artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-artifacts-${{ github.sha }}
          path: |
            data/processed/**
            outputs/**
            artifacts/**