name: CT - Full Rebuild

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/corpus_manifest.json"
      - "scripts/download_corpus.py"
      - "src/ingestion/**"
      - "src/chunking/**"
      - "src/pipeline/**"
      - "src/core/config.py"
      - "Makefile"
      - ".github/workflows/ct-full.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-rebuild:
    name: Download corpus, rebuild indexes, evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RAG_LLM_PROVIDER: stub
      RAG_EMBEDDING_CACHE_DIR: models/sentence-transformers
      RAG_EMBEDDING_OFFLINE: "false"
      RAG_GIT_COMMIT: ${{ github.sha }}
      RAG_DOCKER_IMAGE_TAG: ghcr.io/rastogiujj12/rag-mlops:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models/sentence-transformers
          key: sentence-transformers-${{ hashFiles('src/core/registry.py') }}
          restore-keys: |
            sentence-transformers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download corpus from manifest
        run: |
          make download-corpus

      - name: Run full CT pipeline
        run: |
          python -m src.cli run-full \
            --source pdf \
            --pdf-dir data/raw/pdfs

      - name: Show selected model and evaluation report
        run: |
          echo "Best model:"
          cat outputs/best_model.json

          echo "Evaluation report:"
          cat outputs/eval/evaluation_report.md

      - name: Upload CT artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-artifacts-${{ github.sha }}
          path: |
            data/processed/**
            outputs/**
            artifacts/**