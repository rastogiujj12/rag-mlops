name: CT - Continuous Training

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/corpus_manifest.json"
      - "scripts/download_corpus.py"

jobs:
  continuous-training:
    name: Rebuild retrieval artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RAG_LLM_PROVIDER: stub
      RAG_EMBEDDING_CACHE_DIR: models/sentence-transformers
      RAG_EMBEDDING_OFFLINE: "false"
      RAG_GIT_COMMIT: ${{ github.sha }}
      RAG_DOCKER_IMAGE_TAG: ghcr.io/rastogiujj12/rag-mlops:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/sentence-transformers
          key: sentence-transformers-${{ hashFiles('src/core/registry.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CT pipeline on demo corpus
        run: |
          python -m src.cli run-full \
            --source jsonl \
            --pdf-dir data/raw/pdfs

      - name: Show generated artefacts
        run: |
          echo "Processed data:"
          find data/processed -maxdepth 2 -type f -print || true

          echo "Outputs:"
          find outputs -maxdepth 4 -type f -print || true

          echo "Artefact runs:"
          find artifacts -maxdepth 4 -type f -print || true

      - name: Upload CT artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-artifacts-${{ github.sha }}
          path: |
            data/processed/**
            outputs/**
            artifacts/**