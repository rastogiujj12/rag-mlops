name: CT - Smart Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/corpus_manifest.json"
      - "data/evaluation/**"
      - "scripts/download_corpus.py"
      - "scripts/download_latest_ct_artifact.sh"
      - "src/ingestion/**"
      - "src/chunking/**"
      - "src/indexing/**"
      - "src/retrieval/**"
      - "src/evaluation/**"
      - "src/pipeline/**"
      - "src/core/registry.py"
      - "src/core/config.py"
      - "Makefile"
      - ".github/workflows/ct-smart.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "CT mode to run"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - full
          - dense
          - evaluation

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: Detect CT mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      changed_files: ${{ steps.detect.outputs.changed_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files and choose CT mode
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MODE="${{ github.event.inputs.mode || 'auto' }}"

          if [ "$INPUT_MODE" != "auto" ]; then
            echo "Manual mode selected: $INPUT_MODE"
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            echo "changed_files=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch with auto mode defaults to full."
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "changed_files=manual-auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt || git diff --name-only HEAD~1 HEAD > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          CHANGED="$(paste -sd ',' changed_files.txt)"
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

          FULL_REGEX='^(data/corpus_manifest\.json|scripts/download_corpus\.py|src/ingestion/|src/chunking/|src/pipeline/|src/core/config\.py|Makefile)'
          DENSE_REGEX='^(src/core/registry\.py|src/indexing/dense\.py|src/indexing/model_loader\.py)'
          EVAL_REGEX='^(data/evaluation/|src/evaluation/|src/retrieval/)'

          if grep -Eq "$FULL_REGEX" changed_files.txt; then
            MODE="full"
          elif grep -Eq "$DENSE_REGEX" changed_files.txt; then
            MODE="dense"
          elif grep -Eq "$EVAL_REGEX" changed_files.txt; then
            MODE="evaluation"
          else
            MODE="skip"
          fi

          echo "Selected CT mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  run-ct:
    name: Run selected CT mode
    needs: detect
    if: needs.detect.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RAG_LLM_PROVIDER: stub
      RAG_EMBEDDING_CACHE_DIR: models/sentence-transformers
      RAG_EMBEDDING_OFFLINE: "false"
      RAG_GIT_COMMIT: ${{ github.sha }}
      RAG_DOCKER_IMAGE_TAG: ghcr.io/rastogiujj12/rag-mlops:${{ github.sha }}
      CT_MODE: ${{ needs.detect.outputs.mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models/sentence-transformers
          key: sentence-transformers-${{ hashFiles('src/core/registry.py') }}
          restore-keys: |
            sentence-transformers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest CT artefacts for partial CT
        if: env.CT_MODE == 'dense' || env.CT_MODE == 'evaluation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_latest_ct_artifact.sh

          rm -rf data/processed outputs artifacts
          cp -R runtime-artifacts/data/processed data/processed
          cp -R runtime-artifacts/outputs outputs
          cp -R runtime-artifacts/artifacts artifacts || mkdir -p artifacts

      - name: Verify restored artefacts for partial CT
        if: env.CT_MODE == 'dense' || env.CT_MODE == 'evaluation'
        run: |
          test -f data/processed/chunks.pkl
          test -f data/processed/corpus.jsonl
          test -f outputs/indices/bm25.pkl
          test -d outputs/indices/dense
          cat outputs/best_model.json

      - name: Run full CT
        if: env.CT_MODE == 'full'
        run: |
          make download-corpus
          python -m src.cli run-full \
            --source pdf \
            --pdf-dir data/raw/pdfs

      - name: Run dense rebuild CT
        if: env.CT_MODE == 'dense'
        run: |
          python -m src.cli train --force
          python -m src.cli evaluate

      - name: Run evaluation-only CT
        if: env.CT_MODE == 'evaluation'
        run: |
          python -m src.cli evaluate

      - name: Show selected model and evaluation report
        run: |
          echo "CT mode: $CT_MODE"
          cat outputs/best_model.json
          cat outputs/eval/evaluation_report.md

      - name: Upload CT artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-artifacts-${{ github.sha }}
          path: |
            data/processed/**
            outputs/**
            artifacts/**