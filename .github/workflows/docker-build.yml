name: CD - Docker Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "k8s/**"
      - "kind/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR"
        required: true
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_NAME: ghcr.io/rastogiujj12/rag-mlops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image only
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push_image != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:test

      - name: Build and push Docker image
        if: ${{ github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}