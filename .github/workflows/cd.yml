name: CD - Continuous Delivery

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "Dockerfile"
      - "requirements.txt"
      - "k8s/**"
      - "argocd/**"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "argocd or direct-kind"
        required: false
        default: "argocd"

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run -d --name api -p 8000:8000 \
            -e RAG_GIT_COMMIT=${{ github.sha }} \
            -e RAG_DOCKER_IMAGE_TAG=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo "OK"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/version
          docker logs api
          docker rm -f api

      - name: Update Kubernetes manifest image tag for ArgoCD
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          sed -i "s#image: ghcr.io/.*/.*#image: ${IMAGE}#" k8s/deployment.yaml
          git config user.name "cd-bot"
          git config user.email "cd-bot@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "cd: promote image ${{ github.sha }} [skip ci]" || echo "no manifest change"
          git push || echo "no remote push"

  deploy-kind-direct:
    # Optional fallback when using a self-hosted runner on the laptop with local Kind.
    needs: build-and-publish
    if: github.event.inputs.deploy_mode == 'direct-kind'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to local Kind
        run: |
          IMAGE="${{ needs.build-and-publish.outputs.image }}"
          sed -i "s#image: ghcr.io/.*/.*#image: ${IMAGE}#" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/rag-api --timeout=120s
      - name: Post-deployment smoke test
        run: |
          kubectl port-forward svc/rag-api-service 8000:8000 >/tmp/rag-port-forward.log 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID || true" EXIT
          sleep 5
          BASE_URL=http://localhost:8000 ./scripts/smoke_test.sh
